<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style/inicio.css" />
    <link rel="stylesheet" href="style/registro.css" />
    <title>Registro - Mochileros sin Fronteras</title>
  </head>
  <body>
    <header>
      <a href="/inicio.html" class="nombre">Mochileros Sin Fronteras</a>

      <!-- Menú hamburguesa para móvil -->
      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
      </button>

      <!-- Menú de navegación desktop -->
      <div class="cabecera">
        <a href="#">Inicio</a>
        <a href="#">Experiencias</a>
        <a href="#">Consejos</a>
        <a href="#">Foro</a>
        <a href="#">Contacto</a>
      </div>

      <div class="parte-derecha">
        <img
          src="/images/logo.png"
          alt="Logo Mochileros Sin Fronteras"
          class="logo"
        />
        <select class="idioma">
          <option value="es">ES</option>
          <option value="en">EN</option>
          <option value="fr">FR</option>
        </select>
      </div>
    </header>

    <!-- Overlay para el menú móvil -->
    <div class="mobile-menu-overlay" id="mobileMenuOverlay"></div>

    <!-- Contenedor principal -->
    <div class="contenedor-principal">
      <div class="contenedor-registro">
        <h1 class="titulo-registro">Registro de nuevos usuarios</h1>
        <form class="formulario-registro">
          <div>
            <label for="nombre">Nombre</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Introduce tu nombre"
              required
            />
          </div>
          <div>
            <label for="apellidos">Apellidos</label>
            <input
              type="text"
              id="apellidos"
              name="apellidos"
              placeholder="Introduce tus apellidos"
              required
            />
          </div>
          <div>
            <label for="email">Correo electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Introduce tu email"
              required
            />
          </div>
          <div>
            <label for="confirmar-email">Confirmar correo</label>
            <input
              type="email"
              id="confirmar-email"
              name="confirmar-email"
              placeholder="Confirma tu email"
              required
            />
          </div>
          <div>
            <label for="fecha-nacimiento">Fecha de nacimiento</label>
            <input
              type="date"
              id="fecha-nacimiento"
              name="fecha-nacimiento"
              placeholder="Introduce tu fecha de nacimiento"
              required
            />
          </div>
          <div>
            <label for="contraseña">Contraseña</label>
            <input
              type="password"
              id="contraseña"
              name="contraseña"
              placeholder="Introduce tu contraseña"
              required
            />
          </div>
          <div>
            <label for="repetir-contraseña">Repetir contraseña</label>
            <input
              type="password"
              id="repetir-contraseña"
              name="repetir-contraseña"
              placeholder="Repite tu contraseña"
              required
            />
          </div>
          <div>
            <label for="imagen-perfil">Subir imagen de perfil</label>
            <input
              type="file"
              id="imagen-perfil"
              name="imagen-perfil"
              accept="image/*"
            />
          </div>
          <div class="checkbox-privacidad">
            <input type="checkbox" name="privacidad" id="privacidad" required />
            <label for="privacidad"
              >Acepto la <a href="#">política de privacidad</a></label
            >
          </div>
          <button type="submit">Guardar datos y acceder</button>
        </form>
      </div>
    </div>

    <footer class="pie-pagina">
      <div class="copyright">&copy; 2025 Mochileros Sin Fronteras</div>
      <div class="enlaces-footer">
        <a href="#">Sobre nosotros</a>
        <a href="#">Política de privacidad</a>
        <a href="#">Ayuda</a>
      </div>
      <div class="footer-derecha">
        <div class="redes-sociales">
          <a href="#">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
            >
              <path

              />
            </svg>
          </a>
          <a href="#">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
            >
              <path
                fill="#fff"
                d="M16.6 5.82s.51.5 0 0A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 0 1-2.59 2.5c-1.42 0-2.6-1.16-2.6-2.6c0-1.72 1.66-3.01 3.37-2.48V9.66c-3.45-.46-6.47 2.22-6.47 5.64c0 3.33 2.76 5.7 5.69 5.7c3.14 0 5.69-2.55 5.69-5.7V9.01a7.35 7.35 0 0 0 4.3 1.38V7.3s-1.88.09-3.24-1.48"

            >
              <path
                fill="#ffffff"
                d="m10 15l5.19-3L10 9zm11.56-7.83c.13.47.22 1.1.28 1.9c.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83c-.25.9-.83 1.48-1.73 1.73c-.47.13-1.33.22-2.65.28c-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44c-.9-.25-1.48-.83-1.73-1.73c-.13-.47-.22-1.1-.28-1.9c-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83c.25-.9.83-1.48 1.73-1.73c.47-.13 1.33-.22 2.65-.28c1.3-.07 2.49-.1 3.59-.1L12 5c4.19 0 6.8.16 7.83.44c.9.25 1.48.83 1.73 1.73"

        </div>
        <form class="newsletter">
          <input type="email" placeholder="Tu email" required />
          <button type="submit">Suscribirse</button>
        </form>
      </div>
    </footer>
  </body>
</html>
