<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <link rel="stylesheet" href="style/registro.css" >
    <link rel="stylesheet" href="style/inicio.css" >
    <title>Registro - Mochileros sin Fronteras</title>
  </head>
  <body>
    <header>
      <div class="nombre">Mochileros Sin Fronteras</div>
      <div class="cabecera">
        <a href="#">Inicio</a>
        <a href="#">Experiencias</a>
        <a href="#">Consejos</a>
        <a href="#">Foro</a>
        <a href="#">Contacto</a>
      </div>
      <div class="parte-derecha">
        <img
          src="images/logo.png"
          alt="Logo Mochileros Sin Fronteras"
          class="logo"
        >
        <select class="idioma">
          <option value="es">ES</option>
          <option value="en">EN</option>
          <option value="fr">FR</option>
        </select>
      </div>
    </header>
    <!-- Contenedor principal -->
    <div class="contenedor-principal">
      <div class="contenedor-registro">
        <h1 class="titulo-registro">Registro de nuevos usuarios</h1>
        <form class="formulario-registro">
          <div>
            <label for="nombre">Nombre</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Introduce tu nombre"
              required
            >
          </div>
          <div>
            <label for="apellidos">Apellidos</label>
            <input
              type="text"
              id="apellidos"
              name="apellidos"
              placeholder="Introduce tus apellidos"
              required
            >
          </div>
          <div>
            <label for="email">Correo electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Introduce tu email"
              required
            >
          </div>
          <div>
            <label for="confirmar-email">Confirmar correo</label>
            <input
              type="email"
              id="confirmar-email"
              name="confirmar-email"
              placeholder="Confirma tu email"
              required
            >
          </div>
          <div>
            <label for="fecha-nacimiento">Fecha de nacimiento</label>
            <input
              type="date"
              id="fecha-nacimiento"
              name="fecha-nacimiento"
              required
            >
          </div>
          <div>
            <label for="contraseña">Contraseña</label>
            <input
              type="password"
              id="contraseña"
              name="contraseña"
              placeholder="Introduce tu contraseña"
              required
            >
          </div>
          <div>
            <label for="repetir-contraseña">Repetir contraseña</label>
            <input
              type="password"
              id="repetir-contraseña"
              name="repetir-contraseña"
              placeholder="Repite tu contraseña"
              required
            >
          </div>
          <div>
            <label for="imagen-perfil">Subir imagen de perfil</label>
            <input
              type="file"
              id="imagen-perfil"
              name="imagen-perfil"
              accept="image/*"
            >
          </div>
          <div class="checkbox-privacidad">
            <input type="checkbox" name="privacidad" id="privacidad" required >
            <label for="privacidad"
              >Acepto la <a href="#">política de privacidad</a></label
            >
          </div>
          <button type="submit">Guardar datos y acceder</button>
        </form>
      </div>
    </div>
    <footer>
      <div class="primera-fila">
        <span class="copyright">&copy; 2025 Mochileros Sin Fronteras</span>
        <div class="enlaces-footer">
          <a href="#">Sobre nosotros</a>
          <a href="#">Política de privacidad</a>
          <a href="#">Ayuda</a>
        </div>
        <div class="redes-sociales">
          <a href="https://www.instagram.com" target="_blank" rel="noopener">
            <img src="images/instagram.png" alt="Logo de Instagram" >
          </a>
          <a href="https://www.twitter.com" target="_blank" rel="noopener">
            <img src="images/twitter.png" alt="Logo de Twitter" >
          </a>
          <a href="https://www.tiktok.com" target="_blank" rel="noopener">
            <img src="images/tiktok.png" alt="Logo de TikTok" >
          </a>
        </div>
      </div>
      <form class="newsletter">
        <input type="email" placeholder="Tu email" required >
        <button type="submit">Suscribirse</button>
      </form>
    </footer>
  </body>
</html>
